<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both a getter and a setter so that platform harnesses,
      // devtools, and extension proxies can safely reassign window.fetch without throwing:
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {
          // Graceful fallback if redefine fails
        }
      })();
    </script>
